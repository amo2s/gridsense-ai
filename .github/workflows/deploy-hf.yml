name: Sync Backend to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Setup Git LFS
        run: |
          sudo apt-get update && sudo apt-get install -y git-lfs
          git lfs install

      - name: Push Clean History to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Destroy the old git history completely to evade HF's history scan
          rm -rf .git
          git init
          git checkout -b main

          # 2. Configure Git identity
          git config user.email "bot@gridsense.ai"
          git config user.name "GridSense Deploy Bot"

          # 3. Promote HF deployment infrastructure to root
          cp hf-deployment/Dockerfile ./Dockerfile
          cp hf-deployment/nginx.conf ./nginx.conf
          cp hf-deployment/supervisord.conf ./supervisord.conf

          # 4. Erase offending files so they never exist in this new repo
          rm -rf frontend/
          find backend/ -type f \( -name "*.jpg" -o -name "*.png" -o -name "*.jpeg" \) -delete

          # 5. Track remaining model binaries with Git LFS
          git lfs track "*.onnx"
          git lfs track "*.joblib"
          git lfs track "*.pt"
          git lfs track "*.bin"
          git add .gitattributes

          # 6. Commit as a single, clean snapshot
          git add .
          git commit -m "chore: deploy clean monolith backend"

          # 7. Force push the brand new history to HF
          git remote add huggingface https://Sliverboy:$HF_TOKEN@huggingface.co/spaces/Sliverboy/heal-her-backend
          git push huggingface main --force