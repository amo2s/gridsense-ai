name: Sync Backend to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Git LFS
        run: |
          sudo apt-get update && sudo apt-get install -y git-lfs
          git lfs install

      - name: Prepare Clean Deployment Tree
        run: |
          # 1. Promote HF deployment infrastructure to root
          cp hf-deployment/Dockerfile ./Dockerfile
          cp hf-deployment/nginx.conf ./nginx.conf
          cp hf-deployment/supervisord.conf ./supervisord.conf

          # 2. Configure Git identity
          git config --global user.email "bot@gridsense.ai"
          git config --global user.name "GridSense Deploy Bot"

          # 3. Track model binaries with Git LFS
          git lfs track "*.onnx"
          git lfs track "*.joblib"
          git add .gitattributes

          # 4. Remove unnecessary frontend and doc binaries that HF rejected
          rm -rf frontend/
          find backend/ -type f \( -name "*.jpg" -o -name "*.png" -o -name "*.jpeg" \) -delete

          # 5. Commit cleaned state for HF
          git add -A
          git commit -m "chore: clean build tree with LFS for Hugging Face" || echo "No changes to commit"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add huggingface https://Sliverboy:$HF_TOKEN@huggingface.co/spaces/Sliverboy/heal-her-backend
          git lfs push --all huggingface main || true
          git push huggingface HEAD:main --force