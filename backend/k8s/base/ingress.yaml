apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gridsense-ingress
  namespace: gridsense
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - http:
        paths:
          - path: /api/?(.*)
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
          - path: /query
            pathType: Exact
            backend:
              service:
                name: dashboard-bff-service
                port:
                  number: 8082
