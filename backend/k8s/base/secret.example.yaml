apiVersion: v1
kind: Secret
metadata:
  name: gridsense-secrets
  namespace: gridsense
type: Opaque
# =============================================================================
# WARNING: NEVER COMMIT THIS FILE WITH REAL CREDENTIALS!
#
# This is a template. To use this file:
# 1. Copy it to secret.yaml (which should be ignored by .gitignore)
# 2. Replace the <base64-placeholder> values with actual base64 encoded strings.
#    (e.g., echo -n 'my-secret' | base64)
# 3. Apply to cluster: kubectl apply -f secret.yaml
# =============================================================================
data:
  POSTGRES_PASSWORD: <base64-placeholder>
  JWT_SECRET: <base64-placeholder>
  INTERNAL_SERVICE_KEY: <base64-placeholder>
  ALERT_INTERNAL_KEY: <base64-placeholder>
  ASSISTANT_INTERNAL_KEY: <base64-placeholder>
  UPSTASH_REDIS_URL: <base64-placeholder>
