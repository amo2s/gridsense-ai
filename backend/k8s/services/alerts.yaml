apiVersion: v1
kind: Service
metadata:
  name: alerts-service
  namespace: gridsense
  labels:
    app: alerts
spec:
  type: ClusterIP
  selector:
    app: alerts
  ports:
    - name: http
      port: 8006
      targetPort: 8006
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerts
  namespace: gridsense
  labels:
    app: alerts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alerts
  template:
    metadata:
      labels:
        app: alerts
    spec:
      containers:
        - name: alerts
          image: <region>.ocir.io/<tenancy>/gridsense/alerts:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8006
          env:
            - name: PORT
              value: "8006"
          envFrom:
            - configMapRef:
                name: gridsense-config
            - secretRef:
                name: gridsense-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 256m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 15
