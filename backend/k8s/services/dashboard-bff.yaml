apiVersion: v1
kind: Service
metadata:
  name: dashboard-bff-service
  namespace: gridsense
  labels:
    app: dashboard-bff
spec:
  type: ClusterIP
  selector:
    app: dashboard-bff
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-bff
  namespace: gridsense
  labels:
    app: dashboard-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-bff
  template:
    metadata:
      labels:
        app: dashboard-bff
    spec:
      containers:
        - name: dashboard-bff
          image: <region>.ocir.io/<tenancy>/gridsense/dashboard-bff:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: BFF_PORT
              value: "8082"
          envFrom:
            - configMapRef:
                name: gridsense-config
            - secretRef:
                name: gridsense-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 256m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
