apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: gridsense
  labels:
    app: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: gridsense
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: <region>.ocir.io/<tenancy>/gridsense/gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
            - containerPort: 50051
            - containerPort: 9090
          env:
            - name: GATEWAY_PORT
              value: "8080"
            - name: GRPC_PORT
              value: "50051"
            - name: METRICS_PORT
              value: "9090"
          envFrom:
            - configMapRef:
                name: gridsense-config
            - secretRef:
                name: gridsense-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 256m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
